# A merge to main deploys staging. It does not deploy production.
name: staging
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: staging
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
          TEAM_DOMAIN: ${{ secrets.TEAM_DOMAIN }}
          POLICY_AUD: ${{ secrets.POLICY_AUD }}
        run: |
          set -euo pipefail
          printf '%s' "$ACCOUNT_ID" | pnpm exec wrangler secret put ACCOUNT_ID --config wrangler.mesh.toml --env staging
          printf '%s' "$API_KEY" | pnpm exec wrangler secret put API_KEY --config wrangler.mesh.toml --env staging
          printf '%s' "$TEAM_DOMAIN" | pnpm exec wrangler secret put TEAM_DOMAIN --config wrangler.mesh.toml --env staging
          printf '%s' "$POLICY_AUD" | pnpm exec wrangler secret put POLICY_AUD --config wrangler.mesh.toml --env staging
          pnpm exec wrangler deploy --config wrangler.mesh.toml --env staging
