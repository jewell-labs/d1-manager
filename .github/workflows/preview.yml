# A pull request deploys its own Worker and a copy of the staging D1 database.
# Secrets come from the preview environment: sandbox dev keys, never production keys.
name: preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy the preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID }}
          API_KEY: ${{ secrets.API_KEY }}
          TEAM_DOMAIN: ${{ secrets.TEAM_DOMAIN }}
          POLICY_AUD: ${{ secrets.POLICY_AUD }}
          PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          db="d1-manager-pr-${PR}"
          if ! pnpm exec wrangler d1 list --config wrangler.mesh.toml --json | grep -q "\"name\": \"${db}\""; then
            pnpm exec wrangler d1 create "$db" --config wrangler.mesh.toml
          fi
          id=$(pnpm exec wrangler d1 list --config wrangler.mesh.toml --json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const rows=JSON.parse(s); const row=rows.find(r=>r.name===process.argv[1]); if(!row) process.exit(1); process.stdout.write(row.uuid)})' "$db")
          pnpm exec wrangler d1 export d1-manager-staging --remote --output "$RUNNER_TEMP/staging.sql" --config wrangler.mesh.toml
          pnpm exec wrangler d1 execute "$db" --remote --file "$RUNNER_TEMP/staging.sql" --config wrangler.mesh.toml
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const id = process.argv[1];
            const pr = process.argv[2];
            let text = readFileSync("wrangler.mesh.toml", "utf8");
            text = text.replace("name = \"d1-manager\"", `name = "d1-manager-pr-${pr}"`);
            text = text.replace("database_name = \"d1-manager\"", `database_name = "d1-manager-pr-${pr}"`);
            text = text.replace("database_id = \"b37c561e-6914-4fbf-bf95-427b78eac51d\"", `database_id = "${id}"`);
            text = text.replace("pattern = \"d1-manager.jewell-labs.com\"", `pattern = "pr-${pr}.d1-manager.jewell-labs.com"`);
            writeFileSync("wrangler.preview.toml", text);
          ' "$id" "$PR"
          printf '%s' "$ACCOUNT_ID" | pnpm exec wrangler secret put ACCOUNT_ID --config wrangler.preview.toml
          printf '%s' "$API_KEY" | pnpm exec wrangler secret put API_KEY --config wrangler.preview.toml
          printf '%s' "$TEAM_DOMAIN" | pnpm exec wrangler secret put TEAM_DOMAIN --config wrangler.preview.toml
          printf '%s' "$POLICY_AUD" | pnpm exec wrangler secret put POLICY_AUD --config wrangler.preview.toml
          pnpm exec wrangler deploy --config wrangler.preview.toml
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          body="Preview: https://pr-${PR}.d1-manager.jewell-labs.com"
          gh pr comment "$PR" --body "$body"
